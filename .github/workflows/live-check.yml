name: Live data check

# Values ~30 real NSE/BSE stocks with live Yahoo Finance data and publishes
# a report to the job summary, so data-source breakages are caught early.
on:
  push:
    branches: [main]
  schedule:
    - cron: "30 4 * * 1"        # Mondays 10:00 IST
  workflow_dispatch:
    inputs:
      tickers:
        description: "Space-separated tickers (blank = default basket)"
        required: false

permissions:
  contents: write

concurrency:
  group: live-check
  cancel-in-progress: false

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Value real stocks
        run: python scripts/live_check.py ${{ github.event.inputs.tickers }}
      - name: Publish report to the repo
        if: always() && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/live_check.md
          git diff --cached --quiet && exit 0
          git commit -m "Update live valuation report"
          git pull --rebase
          git push
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: live-check-report
          path: reports/
