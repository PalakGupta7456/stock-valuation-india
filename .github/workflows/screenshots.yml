name: Refresh screenshots

# Runs the app against real stocks and commits fresh README screenshots.
on:
  workflow_dispatch:
    inputs:
      tickers:
        description: "First ticker gets every tab; the rest get an overview"
        default: "TCS HDFCBANK"
  push:
    branches: [main]
    paths: ["app.py", "valuation/**", "scripts/screenshots.py", ".github/workflows/screenshots.yml"]

permissions:
  contents: write

concurrency:
  group: commit-back
  cancel-in-progress: false

jobs:
  shots:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt playwright
      - run: python -m playwright install --with-deps chromium
      - name: Start app
        run: |
          nohup streamlit run app.py --server.port 8501 --server.headless true > streamlit.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:8501/_stcore/health && break; sleep 2; done
      - name: Capture
        run: python scripts/screenshots.py ${{ github.event.inputs.tickers || 'TCS HDFCBANK' }}
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/screenshots
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "Refresh screenshots with live data"
          git pull --rebase
          git push
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: |
            docs/screenshots/
            streamlit.log
