name: Refresh company list

# Rebuilds data/nse_symbols.csv and data/bse_symbols.csv (the app's search box)
# from the exchanges' official lists.
on:
  schedule:
    - cron: "0 1 * * 0"         # Sundays 06:30 IST
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["scripts/update_symbols.py", ".github/workflows/update-symbols.yml"]

permissions:
  contents: write

concurrency:
  group: update-symbols
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install pandas requests
      - run: python scripts/update_symbols.py
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "Refresh NSE/BSE company list"
          git pull --rebase
          git push
